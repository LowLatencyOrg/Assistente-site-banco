services:
  api:
    build:
      context: ${BASE_DIR}/Site-Grupo03
    container_name: lowlatency-api
    restart: unless-stopped
    ports:
      - "3333:3333"

    env_file:
      - ${BASE_DIR}/Site-Grupo03/.env

    networks:
      - lowlatency-net

networks:
  lowlatency-net:
    external: true